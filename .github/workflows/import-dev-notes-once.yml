name: One-time private notes migration to development D1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-dev-notes-once.yml']
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover historical notes in runner memory and import to dev D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b02028374331cfa6bda334ffaf79b1cf
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 - <<'PY'
          import json,re,subprocess,sqlite3,pathlib
          source=subprocess.check_output(['git','show','f636daa9dd98:index.html'],text=True)
          match=re.search(r'const historicalNotes=(\[[^\n]*\]);',source)
          if not match: raise SystemExit('Historical notes not found')
          notes=json.loads(match.group(1))
          if len(notes)!=44 or not all(isinstance(n,str) and n.strip() for n in notes):
              raise SystemExit('Unexpected notes data: aborting')
          con=sqlite3.connect(':memory:')
          sql=["BEGIN TRANSACTION;"]
          for i,note in enumerate(notes):
              escaped=note.replace("'","''")
              sql.append("INSERT INTO trip_notes (trip_key,note,updated_at) VALUES ('"+str(i)+"','"+escaped+"',strftime('%Y-%m-%dT%H:%M:%fZ','now')) ON CONFLICT(trip_key) DO NOTHING;")
          sql.append("COMMIT;")
          pathlib.Path('/tmp/private-note-import.sql').write_text('\n'.join(sql))
          print('Prepared 44 private notes for authenticated development import; note contents omitted.')
          PY
          npx --yes wrangler d1 execute bonch-dev-db --remote --config wrangler.toml --file /tmp/private-note-import.sql >/tmp/d1-import-result.log 2>&1 || { echo 'D1 import failed; diagnostic output suppressed to protect note contents'; exit 1; }
          rm -f /tmp/private-note-import.sql /tmp/d1-import-result.log
          npx --yes wrangler d1 execute bonch-dev-db --remote --config wrangler.toml --command 'SELECT COUNT(*) AS note_count FROM trip_notes;'
