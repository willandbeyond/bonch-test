name: Import Running the Union GPX
on:
  push:
    paths:
      - '.github/workflows/import-union-gpx.yml'
      - 'union/import_gpx.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-union-gpx
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download shared GPX folder
        run: |
          curl --location --retry 2 --max-time 90 -w 'HTTP %{http_code}; bytes %{size_download}; type %{content_type}\n' -o routes.zip 'https://www.dropbox.com/scl/fo/unr1nk9or68t50lu2aaew/AAiB8BznDww4pxOUzNL25xY?rlkey=zy2anl5ks30aw531k4gxqipp8&dl=1'
          file routes.zip
          unzip -t routes.zip | tail -3
          python - <<'PY'
          import pathlib, re, zipfile
          dest = pathlib.Path("downloaded")
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile("routes.zip") as archive:
              for member in archive.infolist():
                  name = pathlib.PurePosixPath(member.filename).name
                  if not re.fullmatch(r"Running the Union #\d+ .+\.gpx", name, re.I):
                      continue
                  (dest / name).write_bytes(archive.read(member))
                  print("Extracted", name)
          PY
      - name: Import corrected Vermont and new Louisiana GPX
        run: python union/import_gpx.py
      - name: Classify newly imported and corrected named roads
        run: python union/classify_remaining.py > union/classify-remaining-log.txt 2>&1
      - name: Publish route data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add union/routes.geojson union/classify-remaining-log.txt
          if ! git diff --cached --quiet; then
            git commit -m 'union: refresh Vermont and add Louisiana GPX traces'
            git push
          fi

      - name: Record import diagnostics
        if: always()
        run: |
          mkdir -p union
          {
            echo "Run: ${GITHUB_RUN_ID}"
            echo "Result: ${{ job.status }}"
            if test -f routes.zip; then
              echo "Downloaded bytes: $(wc -c < routes.zip)"
              echo "File type: $(file -b routes.zip)"
              echo "ZIP signature: $(head -c 4 routes.zip | od -An -tx1)"
              echo "ZIP test:"
              unzip -t routes.zip 2>&1 | tail -8
            else
              echo "No routes.zip was downloaded"
            fi
          } > union/import-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add union/import-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m 'union: record GPX import diagnostics'
            git push
          fi
