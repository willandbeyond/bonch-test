name: Verify development API security
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check health and reject anonymous admin requests
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bonch-dev.will-boncher.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl --silent --show-error --max-time 15 -o health.json -w '%{http_code}' "$BASE/api/health") || code=000
            if [ "$code" = 200 ]; then break; fi
            sleep 10
          done
          test "$code" = 200 || { echo "Health endpoint HTTP $code"; cat health.json || true; exit 1; }
          grep -q '"databaseConfigured":true' health.json
          for path in /api/admin/me /api/admin/notes; do
            code=$(curl --silent --show-error --max-time 15 -o response.json -w '%{http_code}' "$BASE$path")
            test "$code" = 401 || { echo "Anonymous $path returned HTTP $code (expected 401)"; exit 1; }
          done
          code=$(curl --silent --show-error --max-time 15 -o response.json -w '%{http_code}' -H 'Authorization: Bearer invalid.jwt.token' "$BASE/api/admin/notes")
          test "$code" = 401 || { echo "Invalid token returned HTTP $code (expected 401)"; exit 1; }
          code=$(curl --silent --show-error --max-time 15 -o response.json -w '%{http_code}' -X POST "$BASE/api/admin/notes")
          test "$code" = 405 || { echo "POST returned HTTP $code (expected 405)"; exit 1; }
          echo "PASS: Worker health, D1 binding, anonymous denial, invalid-token denial, and read-only policy."
