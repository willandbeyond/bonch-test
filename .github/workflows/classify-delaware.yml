name: Classify Delaware Avenue GPX
on:
  push:
    paths:
      - '.github/workflows/classify-delaware.yml'
      - 'union/classify_delaware.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match GPX to OSM Delaware Avenue ways
        run: |
          python union/classify_delaware.py > union/delaware-classification-log.txt 2>&1 || { cat union/delaware-classification-log.txt; exit 1; }
          cat union/delaware-classification-log.txt
      - name: Publish classified route
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add union/routes.geojson
          if ! git diff --cached --quiet; then
            git commit -m 'union: color Delaware Avenue versus connectors'
            git push
          fi
      - name: Save diagnostics even if classification fails
        if: always()
        run: |
          if test ! -f union/delaware-classification-log.txt; then
            echo "Classifier did not start" > union/delaware-classification-log.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add union/delaware-classification-log.txt
          if ! git diff --cached --quiet; then
            git commit -m 'union: save Delaware classification diagnostics'
            git push
          fi
