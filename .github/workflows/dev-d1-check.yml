name: Verify development D1 access
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-d1-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check development D1 access (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b02028374331cfa6bda334ffaf79b1cf
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler d1 execute bonch-dev-db --remote --config wrangler.toml --command 'SELECT COUNT(*) AS note_count FROM trip_notes;'
