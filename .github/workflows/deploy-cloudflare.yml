name: Deploy development site to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Prepare static assets
        run: |
          mkdir -p dist
          cp index.html services.html versions.html train-*.png dist/

      - name: Deploy to bonch-dev Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_CI_CD_TOKEN }}
          accountId: b02028374331cfa6bda334ffaf79b1cf
          command: deploy --name bonch-dev --assets ./dist --compatibility-date 2026-10-24
