<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spreadsheet snapshot · bonch.fyi TEST</title><style>body{font:16px/1.5 system-ui;background:#14181d;color:#e8edf0;max-width:1100px;margin:auto;padding:24px}a{color:#8cc4ff}.muted{color:#b6c2ca}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#222a33;padding:16px;border-radius:12px}.value{font-size:1.3rem;font-weight:700}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px;border-bottom:1px solid #35404b}th{position:sticky;top:0;background:#14181d}input{padding:12px;width:100%;max-width:400px;margin:14px 0;background:#222a33;color:white;border:1px solid #64748b;border-radius:8px}.scroll{overflow:auto}h1{margin-bottom:0}</style></head><body><p><a href="index.html">← Train tracker</a> · TEST</p><h1>Amtrak tracker — spreadsheet snapshot</h1><p class="muted">Read-only export of the master Google Sheet. No database, login-dependent data, or calculations of track coverage.</p><section class="cards" id="metrics"></section><h2>Trip history</h2><input id="search" type="search" placeholder="Search service, station, date…" aria-label="Search trips"><p id="count" class="muted"></p><div class="scroll"><table><thead><tr><th>Date</th><th>Service</th><th>From</th><th>To</th><th>Accommodation</th></tr></thead><tbody id="rows"></tbody></table></div><script src="snapshot-data.js"></script><script>const data=window.TRAIN_SNAPSHOT;const metrics=document.getElementById('metrics');for(const [label,value] of Object.entries(data.metrics)){const c=document.createElement('div');c.className='card';const l=document.createElement('div');l.className='muted';l.textContent=label;const v=document.createElement('div');v.className='value';v.textContent=value;c.append(l,v);metrics.append(c)}const input=document.getElementById('search'),rows=document.getElementById('rows'),count=document.getElementById('count');function render(){const q=input.value.toLowerCase();const matches=data.trips.filter(t=>Object.values(t).join(' ').toLowerCase().includes(q));rows.replaceChildren();for(const t of matches){const tr=document.createElement('tr');for(const key of ['date','service','from','to','accommodation']){const td=document.createElement('td');td.textContent=t[key]||'';tr.append(td)}rows.append(tr)}count.textContent=matches.length+' trips shown'}input.addEventListener('input',render);render();</script></body></html>
