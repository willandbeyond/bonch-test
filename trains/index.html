<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amtrak Completion · bonch.fyi TEST</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light;--ink:#18232b;--muted:#61717b;--line:#dce5e8;--bg:#f4f7f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{position:relative;padding:8px 14px;background:#fff0f0;border-bottom:1px solid #f0caca;text-align:center;color:#b42318;font-weight:800}.home-link{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:5px;color:#52636b;font-size:.82rem;font-weight:500;text-decoration:none}.home-link:hover{text-decoration:underline;color:#126e73}.home-link:focus-visible{outline:2px solid #126e73;outline-offset:3px}a{color:#126e73}.map-wrap{position:relative;height:51vh;min-height:310px;background:#e6ecec}.map-wrap iframe{display:block;width:100%;height:100%;border:0}.map-wrap:fullscreen{height:100vh;width:100vw;background:white}.map-wrap:fullscreen iframe{height:100%}.fullscreen{position:absolute;left:10px;top:84px;z-index:10;width:34px;height:34px;display:grid;place-items:center;border:2px solid #b0b0b0;border-radius:4px;background:white;color:#18232b;padding:0;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 1px 5px #0003}main{max-width:1400px;margin:auto;padding:20px 18px 60px}h2{margin:10px 0 16px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.label{font-size:.85rem;color:var(--muted)}.value{font-size:1.25rem;font-weight:700;margin-top:6px}.value.time-value{font-size:1.05rem;white-space:nowrap;letter-spacing:-.025em}.dashboard-title{text-align:center;letter-spacing:.055em}.section-head{max-width:800px;margin-inline:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:nowrap;margin-top:32px;margin-bottom:18px}.section-head h2{margin:0;flex-shrink:0}.section-head input{width:min(52%,290px);min-width:0}.scroll{overflow-x:auto;max-width:800px;margin-inline:auto;background:white;border:1px solid var(--line);border-radius:12px} .scroll table{table-layout:fixed} .scroll th:nth-child(1),.scroll td:nth-child(1){width:23%}.scroll th:nth-child(2),.scroll td:nth-child(2){width:42%}.scroll th:nth-child(3),.scroll td:nth-child(3){width:35%}table{border-collapse:collapse;width:100%;min-width:0}th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);font-size:1rem;overflow-wrap:anywhere}th{background:#f9fbfb}input{border:1px solid #bbcbd0;border-radius:8px;padding:10px 12px;max-width:100%;width:290px}.muted{color:var(--muted)}@media(max-width:650px){.map-wrap{height:43vh;min-height:270px}header{padding:10px 14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.value{font-size:1.05rem}.card{padding:12px}main{padding:14px}} .trip-row{cursor:pointer}.trip-row:hover,.trip-row:focus{background:#edf5f4;outline:2px solid #126e73;outline-offset:-2px}.actions{max-width:800px;margin-inline:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin:12px auto}.actions button,.details button{border:1px solid #b7c7ca;border-radius:7px;background:white;padding:8px 12px;cursor:pointer}.service-link{border:0;background:none;color:#126e73;text-decoration:underline;text-underline-offset:3px;font:inherit;font-weight:inherit;padding:0;text-align:left;cursor:pointer}.service-list{max-height:60vh;overflow:auto}.service-list table{min-width:0}.service-list th,.service-list td{font-size:.88rem;padding:8px}.service-list td:nth-child(2){white-space:nowrap}.details.services-dialog{max-width:650px} .details{border:1px solid #ccd9dc;background:#fff;border-radius:12px;padding:18px;max-width:480px;width:calc(100% - 30px)}.details::backdrop{background:#0007}.details h3{margin:0 0 12px}.services-dialog h3{display:flex;align-items:baseline;gap:8px}.services-dialog h3 small{font-size:.8rem;color:var(--muted);font-weight:400}.station-code{font-weight:700}.station-name{color:var(--muted);font-size:.9em}.trip-route{line-height:1.65}.details p{margin:9px 0}.details .close{float:right}.route-cell{white-space:normal} @media(max-width:650px){th,td{padding:9px 6px;font-size:.9rem}} </style></head><body><header><a class="home-link" href="/" aria-label="Back to bonch.fyi homepage" title="Back to bonch.fyi homepage">⌂ <span>bonch.fyi</span></a><span>Test environment</span></header><section id="map" class="map-wrap" aria-label="Amtrak system map"><iframe title="Existing Leaflet train map" src="https://script.google.com/macros/s/AKfycbwfyE52sV4h09hp6z8V8tYdJ9msZfAgETcrHPTkcm9XEoDNflmdhw50T6C7_cREy6VfdA/exec" loading="eager"></iframe><button id="fullscreen" class="fullscreen" type="button" aria-label="Toggle fullscreen map" title="Fullscreen map">⛶</button></section><main><h2 class="dashboard-title">AMTRAK SYSTEM COMPLETION</h2><div id="metrics" class="metrics"></div><div class="section-head"><h2>Trips</h2><input id="search" type="search" placeholder="Search trips…" aria-label="Search trips"></div><div class="scroll"><table><thead><tr><th>Date</th><th>Service</th><th>Route</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><span id="count" class="muted"></span><button id="showAll" type="button">Show all trips</button><button id="showFive" type="button" hidden>Show recent 5</button></div><dialog id="servicesDetails" class="details services-dialog"><button class="close" id="closeServices" type="button" aria-label="Close services">✕</button><h3>Named services <small id="servicesSummary"></small></h3><div class="service-list"><table><thead><tr><th>Service</th><th>Ridden?</th><th>First ridden</th></tr></thead><tbody id="serviceRows"></tbody></table></div></dialog><dialog id="tripDetails" class="details"><button class="close" id="closeDetails" type="button" aria-label="Close details">✕</button><h3 id="detailDate"></h3><p id="detailRoute" class="trip-route"></p><p id="detailService"></p><p id="detailMileage"></p><p id="detailAccommodation"></p><p id="detailNotes"></p></dialog></main><script src="../snapshot-data.js"></script><script>const data=window.TRAIN_SNAPSHOT;const metrics=document.getElementById('metrics');for(const label of ['Total miles logged','Trips logged','Total time','Named services ridden','Most ridden route']){const value=data.metrics[label];if(value===undefined)continue;const c=document.createElement('div');c.className='card';const l=document.createElement('div');l.className='label';l.textContent=label;const v=document.createElement('div');v.className='value';if(label==='Named services ridden'){const button=document.createElement('button');button.className='service-link';button.type='button';button.textContent=value;button.setAttribute('aria-label','View named services ridden table');button.addEventListener('click',()=>document.getElementById('servicesDetails').showModal());v.append(button)}else{if(label==='Total miles logged'){v.textContent=Number(value.replace(/[^\d.]/g,'')).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+' mi'}else if(label==='Total time'){const [h,m]=value.split(':');v.classList.add('time-value');v.textContent=Number(h)+' hr '+Number(m)+' min'}else if(label==='Most ridden route'){const parts=value.split(' — ');const strong=document.createElement('strong');strong.textContent=(parts[0]||'').replace(' ↔ ',' ↔ ');const line=document.createElement('div');line.textContent=parts[1]||'';line.style.fontWeight='400';v.append(strong,line)}else{v.textContent=value}}c.append(l,v);metrics.append(c)}const serviceRows=document.getElementById('serviceRows');for(const service of data.namedServices){const tr=document.createElement('tr');for(const value of [service.service,service.ridden?'Yes':'No',service.firstRidden]){const td=document.createElement('td');td.textContent=value;tr.append(td)}serviceRows.append(tr)}document.getElementById('servicesSummary').textContent=data.metrics['Named services ridden'].replace(/ services$/,'');document.getElementById('closeServices').addEventListener('click',()=>document.getElementById('servicesDetails').close());const input=document.getElementById('search'),rows=document.getElementById('rows'),count=document.getElementById('count'),allBtn=document.getElementById('showAll'),fiveBtn=document.getElementById('showFive'),dialog=document.getElementById('tripDetails');let showAll=false;const recent=[...data.trips].reverse();function detail(t){document.getElementById('detailDate').textContent=t.date;document.getElementById('detailService').textContent='Service: '+t.service;const route=document.getElementById('detailRoute');route.replaceChildren();for(const [code,prefix] of [[t.from,''],[t.to,' to ']]){if(prefix)route.append(document.createTextNode(prefix));const bold=document.createElement('strong');bold.className='station-code';bold.textContent=code;const name=document.createElement('span');name.className='station-name';name.textContent=' ('+(data.stationNames[code]||code)+')';route.append(bold,name)}document.getElementById('detailMileage').textContent='Mileage: '+(t.miles?Number(t.miles).toLocaleString('en-US',{maximumFractionDigits:2})+' mi':'Not available');document.getElementById('detailAccommodation').textContent='Accommodation: '+(t.accommodation||'Not recorded');document.getElementById('detailNotes').textContent='Notes: '+(t.notes||'None recorded');dialog.showModal()}function render(){const q=input.value.toLowerCase();const matches=recent.filter(t=>Object.values(t).join(' ').toLowerCase().includes(q));const shown=showAll||q?matches:matches.slice(0,5);rows.replaceChildren();for(const t of shown){const tr=document.createElement('tr');tr.className='trip-row';tr.tabIndex=0;tr.setAttribute('role','button');tr.setAttribute('aria-label','View '+t.service+' trip details');for(const value of [t.date,t.service,t.from+' → '+t.to]){const td=document.createElement('td');td.textContent=value;tr.append(td)}tr.addEventListener('click',()=>detail(t));tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();detail(t)}});rows.append(tr)}count.textContent=shown.length+' of '+matches.length+' trips';allBtn.hidden=showAll||!!q;fiveBtn.hidden=!showAll||!!q}input.addEventListener('input',render);allBtn.addEventListener('click',()=>{showAll=true;render()});fiveBtn.addEventListener('click',()=>{showAll=false;render()});document.getElementById('closeDetails').addEventListener('click',()=>dialog.close());render();const map=document.getElementById('map'),btn=document.getElementById('fullscreen');btn.addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen()}else if(map.requestFullscreen){map.requestFullscreen()}});document.addEventListener('fullscreenchange',()=>{btn.textContent=document.fullscreenElement?'✕':'⛶';btn.title=document.fullscreenElement?'Exit fullscreen':'Fullscreen map';btn.setAttribute('aria-label',btn.title)});</script></body></html>
