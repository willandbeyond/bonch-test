<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amtrak System Completion Map · bonch.fyi</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#18232b;font:15px/1.45 system-ui,sans-serif}header{padding:12px 16px;border-bottom:1px solid #dce5e8;display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#126e73}.stats{padding:12px 16px;display:flex;gap:8px 20px;flex-wrap:wrap;background:#f7f9f9}.stats strong{font-size:1.08rem}#map{height:calc(100dvh - 165px);min-height:360px;background:#edf0f0}.legend{background:white;padding:9px 12px;border-radius:6px;box-shadow:0 1px 7px #0003}.key{display:inline-block;width:22px;border-top:4px solid;vertical-align:middle;margin-right:7px}.notice{padding:8px 16px;background:#fff4e9;color:#8a4300}label{white-space:nowrap}.map-actions{display:flex;gap:10px;align-items:center}.map-actions button{background:#fff;border:1px solid #cbd7da;border-radius:7px;padding:6px 9px;color:#126e73;font:inherit;cursor:pointer}.stats{align-items:baseline}.stats strong{font-variant-numeric:tabular-nums}@media(max-width:600px){#map{height:calc(100dvh - 170px);min-height:300px}header{font-size:13px;padding:9px 12px}.stats{padding:8px 12px;gap:2px 12px}.stats strong{font-size:1rem}.map-actions{gap:6px}.map-actions button{font-size:12px;padding:5px 7px}.legend{font-size:12px;padding:6px 9px}}</style></head><body><header><strong><a href="index.html">← Train Tracker</a> / Rail map</strong><div class="map-actions"><button type="button" id="reset" title="Show entire Amtrak network">Fit network</button><label><input id="only" type="checkbox"> Ridden only</label></div></header><div class="stats"><strong id="miles">Loading track map…</strong><span id="segments"></span></div><div style="padding:3px 16px;font-size:11px;color:#667681;background:#f7f9f9">Map build: <strong>v0.5.3 · mobile-controls</strong> · <span id="built">2026-10-24</span></div><div id="notice" role="status" hidden class="notice"></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(async function(){
const notice=document.getElementById('notice');function warn(s){notice.hidden=false;notice.textContent=s}
if(!window.L){warn('Map library could not load.');return}
const map=L.map('map',{preferCanvas:true}).setView([39,-98],4);
const base=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18}).addTo(map);
let tilesOk=false;base.on('tileload',()=>{tilesOk=true});base.on('tileerror',()=>{if(!tilesOk)warn('Background tiles are unavailable; the track overlay can still be explored.')});
const gray=L.layerGroup().addTo(map),red=L.layerGroup().addTo(map);
document.getElementById('only').addEventListener('change',e=>{if(e.target.checked)map.removeLayer(gray);else gray.addTo(map)});
try{
const response=await fetch('train-map-data.json',{cache:'no-cache'});if(!response.ok)throw Error('Track data HTTP '+response.status);
const d=await response.json(),stats=d.stats;let plotted=0,invalid=0;const bounds=L.latLngBounds();
for(const s of d.segments){
if(!Array.isArray(s.coords)||s.coords.length<2){invalid++;continue}
// Spreadsheet/GeoJSON coordinates are [longitude, latitude]; Leaflet requires [latitude, longitude].
const pts=s.coords.map(p=>[Number(p[1]),Number(p[0])]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])&&p[0]>=-90&&p[0]<=90&&p[1]>=-180&&p[1]<=180);
if(pts.length<2){invalid++;continue}
const line=L.polyline(pts,{color:s.ridden?'#d7263d':'#aeb8bd',weight:s.ridden?3.5:2,opacity:s.ridden?.95:.7,interactive:true});
line.bindPopup('<strong>'+s.id+'</strong><br>'+Number(s.miles).toFixed(2)+' miles<br>'+(s.ridden?'Ridden':'Not ridden')+'<br>'+s.services.join(', '));
line.addTo(s.ridden?red:gray);for(const p of pts)bounds.extend(p);plotted++;
}
const fitNetwork=()=>{if(bounds.isValid())map.fitBounds(bounds,{padding:[12,12],maxZoom:6})};fitNetwork();document.getElementById('reset').addEventListener('click',fitNetwork);
document.getElementById('miles').textContent=stats.riddenMiles.toLocaleString('en-US')+' / '+stats.networkMiles.toLocaleString('en-US')+' miles ('+(stats.riddenMiles/stats.networkMiles*100).toFixed(1)+'%)';
document.getElementById('segments').textContent=stats.riddenSegments+' / '+stats.totalSegments+' segments · '+d.trips.length+' trips';
if(invalid)warn(invalid+' segments have invalid or missing geometry.');if(!plotted)warn('No valid track geometry found.');
const legend=L.control({position:'bottomright'});legend.onAdd=function(){const el=L.DomUtil.create('div','legend');el.innerHTML='<span class="key" style="border-color:#d7263d"></span>Ridden<br><span class="key" style="border-color:#aeb8bd"></span>Unridden';return el};legend.addTo(map);
}catch(e){warn('Map initialization issue: '+e.message);if(document.getElementById('miles').textContent==='Loading track map…')document.getElementById('miles').textContent='Map unavailable';console.error(e)}
})();
</script></body></html>
