<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amtrak Rail Map · bonch.fyi</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:15px system-ui;background:#f4f7f7;color:#18232b}header{padding:12px 18px;background:white;display:flex;justify-content:space-between;align-items:center}a{color:#126e73}#map{height:calc(100dvh - 115px)}.summary{padding:10px 18px;background:white;display:flex;gap:16px;flex-wrap:wrap}.legend{background:white;padding:10px;border-radius:8px;box-shadow:0 1px 8px #0002}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}.err{padding:20px;color:#a32}</style></head><body><header><strong><a href="index.html">← Train Tracker</a> / Rail map</strong><label><input id="only" type="checkbox"> Ridden only</label></header><div class="summary"><strong id="coverage">Loading authoritative track geometry…</strong><span id="details"></span></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{preferCanvas:true}).setView([39,-97],4);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:18}).addTo(map);
const layers={ridden:L.layerGroup().addTo(map),unridden:L.layerGroup().addTo(map)};
document.getElementById('only').addEventListener('change',e=>{if(e.target.checked)map.removeLayer(layers.unridden);else layers.unridden.addTo(map)});
fetch('train-map-data.json').then(r=>{if(!r.ok)throw Error('Map data not deployed ('+r.status+')');return r.json()}).then(d=>{
 const st=d.stats;document.getElementById('coverage').textContent=st.riddenMiles.toLocaleString()+' / '+st.networkMiles.toLocaleString()+' unique miles ('+(100*st.riddenMiles/st.networkMiles).toFixed(1)+'%)';
 document.getElementById('details').textContent=st.riddenSegments+' / '+st.totalSegments+' physical segments · '+d.trips.length+' trips';
 const bounds=[];for(const s of d.segments){if(!s.coords||s.coords.length<2)continue;const poly=L.polyline(s.coords,{color:s.ridden?'#dc3545':'#9da9b1',weight:s.ridden?4:2,opacity:s.ridden?.95:.6}).bindPopup('<b>'+s.id+'</b><br>'+s.miles+' miles<br>'+(s.ridden?'Ridden':'Not ridden')+'<br>'+s.services.join(', '));poly.addTo(s.ridden?layers.ridden:layers.unridden);if(s.coords.length)bounds.push(s.coords[0]);}if(bounds.length)map.fitBounds(bounds,{padding:[20,20]});if(d.unresolved.length)document.getElementById('details').textContent+=' · '+d.unresolved.length+' unresolved journeys';
}).catch(e=>{document.getElementById('coverage').textContent='Map data unavailable';document.getElementById('details').textContent=e.message;console.error(e)});
</script></body></html>
