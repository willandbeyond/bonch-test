<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Train Tracker · bonch.fyi TEST</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light;--ink:#18232b;--muted:#61717b;--line:#dce5e8;--bg:#f4f7f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px max(18px,calc((100vw - 1400px)/2));background:white;border-bottom:1px solid var(--line)}header strong{font-size:1.2rem}a{color:#126e73}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.map-wrap{position:relative;height:51vh;min-height:310px;background:#e6ecec}.map-wrap iframe{display:block;width:100%;height:100%;border:0}.map-wrap:fullscreen{height:100vh;width:100vw;background:white}.map-wrap:fullscreen iframe{height:100%}.fullscreen{position:absolute;left:10px;top:84px;z-index:10;width:34px;height:34px;display:grid;place-items:center;border:2px solid #b0b0b0;border-radius:4px;background:white;color:#18232b;padding:0;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 1px 5px #0003}main{max-width:1400px;margin:auto;padding:20px 18px 60px}h2{margin:10px 0 16px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.label{font-size:.85rem;color:var(--muted)}.value{font-size:1.25rem;font-weight:700;margin-top:6px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:nowrap;margin-top:26px}.section-head h2{margin:0;flex-shrink:0}.section-head input{width:min(52%,290px);min-width:0}.scroll{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:0}th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);font-size:1rem;overflow-wrap:anywhere}th{background:#f9fbfb}input{border:1px solid #bbcbd0;border-radius:8px;padding:10px 12px;max-width:100%;width:290px}.muted{color:var(--muted)}@media(max-width:650px){.map-wrap{height:43vh;min-height:270px}header{padding:10px 14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.value{font-size:1.05rem}.card{padding:12px}main{padding:14px}} .trip-row{cursor:pointer}.trip-row:hover,.trip-row:focus{background:#edf5f4;outline:2px solid #126e73;outline-offset:-2px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.actions button,.details button{border:1px solid #b7c7ca;border-radius:7px;background:white;padding:8px 12px;cursor:pointer}.details{border:1px solid #ccd9dc;background:#fff;border-radius:12px;padding:18px;max-width:480px;width:calc(100% - 30px)}.details::backdrop{background:#0007}.details h3{margin:0 0 12px}.details p{margin:9px 0}.details .close{float:right}.route-cell{white-space:normal} @media(max-width:650px){th,td{padding:9px 6px;font-size:.9rem}th:first-child,td:first-child{width:68px}th:nth-child(2),td:nth-child(2){width:39%}} </style></head><body><header><strong>Train Tracker <span class="muted">· TEST</span></strong><nav><a href="map.html">Map only</a><a href="snapshot.html">Snapshot</a><a href="legacy-dashboard.html">Old dashboard</a></nav></header><section id="map" class="map-wrap" aria-label="Amtrak system map"><iframe title="Existing Leaflet train map" src="https://script.google.com/macros/s/AKfycbwfyE52sV4h09hp6z8V8tYdJ9msZfAgETcrHPTkcm9XEoDNflmdhw50T6C7_cREy6VfdA/exec" loading="eager"></iframe><button id="fullscreen" class="fullscreen" type="button" aria-label="Toggle fullscreen map" title="Fullscreen map">⛶</button></section><main><h2>Amtrak system completion</h2><div id="metrics" class="metrics"></div><div class="section-head"><h2>Trips</h2><input id="search" type="search" placeholder="Search trips…" aria-label="Search trips"></div><div class="actions"><span id="count" class="muted"></span><button id="showAll" type="button">Show all trips</button><button id="showFive" type="button" hidden>Show recent 5</button></div><div class="scroll"><table><thead><tr><th>Date</th><th>Service</th><th>Route</th></tr></thead><tbody id="rows"></tbody></table></div><dialog id="tripDetails" class="details"><button class="close" id="closeDetails" type="button" aria-label="Close details">✕</button><h3 id="detailTitle"></h3><p id="detailDate"></p><p id="detailFrom"></p><p id="detailTo"></p><p id="detailAccommodation"></p><p id="detailNotes"></p></dialog></main><script src="snapshot-data.js"></script><script>const data=window.TRAIN_SNAPSHOT;const metrics=document.getElementById('metrics');for(const [label,value] of Object.entries(data.metrics)){if(['Unique miles ridden','Segments ridden'].includes(label))continue;const c=document.createElement('div');c.className='card';const l=document.createElement('div');l.className='label';l.textContent=label;const v=document.createElement('div');v.className='value';v.textContent=value;c.append(l,v);metrics.append(c)}const input=document.getElementById('search'),rows=document.getElementById('rows'),count=document.getElementById('count'),allBtn=document.getElementById('showAll'),fiveBtn=document.getElementById('showFive'),dialog=document.getElementById('tripDetails');let showAll=false;const recent=[...data.trips].reverse();function detail(t){document.getElementById('detailTitle').textContent=t.service;document.getElementById('detailDate').textContent=t.date;document.getElementById('detailFrom').textContent='From: '+(data.stationNames[t.from]||t.from)+' ('+t.from+')';document.getElementById('detailTo').textContent='To: '+(data.stationNames[t.to]||t.to)+' ('+t.to+')';document.getElementById('detailAccommodation').textContent='Accommodation: '+(t.accommodation||'Not recorded');document.getElementById('detailNotes').textContent='Notes: '+(t.notes||'None recorded');dialog.showModal()}function render(){const q=input.value.toLowerCase();const matches=recent.filter(t=>Object.values(t).join(' ').toLowerCase().includes(q));const shown=showAll||q?matches:matches.slice(0,5);rows.replaceChildren();for(const t of shown){const tr=document.createElement('tr');tr.className='trip-row';tr.tabIndex=0;tr.setAttribute('role','button');tr.setAttribute('aria-label','View '+t.service+' trip details');for(const value of [t.date,t.service,t.from+' → '+t.to]){const td=document.createElement('td');td.textContent=value;tr.append(td)}tr.addEventListener('click',()=>detail(t));tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();detail(t)}});rows.append(tr)}count.textContent=shown.length+' of '+matches.length+' trips';allBtn.hidden=showAll||!!q;fiveBtn.hidden=!showAll||!!q}input.addEventListener('input',render);allBtn.addEventListener('click',()=>{showAll=true;render()});fiveBtn.addEventListener('click',()=>{showAll=false;render()});document.getElementById('closeDetails').addEventListener('click',()=>dialog.close());render();const map=document.getElementById('map'),btn=document.getElementById('fullscreen');btn.addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen()}else if(map.requestFullscreen){map.requestFullscreen()}});document.addEventListener('fullscreenchange',()=>{btn.textContent=document.fullscreenElement?'✕':'⛶';btn.title=document.fullscreenElement?'Exit fullscreen':'Fullscreen map';btn.setAttribute('aria-label',btn.title)});</script></body></html>
