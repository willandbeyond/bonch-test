<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Train Tracker · bonch.fyi TEST</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light;--ink:#18232b;--muted:#61717b;--line:#dce5e8;--bg:#f4f7f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px max(18px,calc((100vw - 1400px)/2));background:white;border-bottom:1px solid var(--line)}header strong{font-size:1.2rem}a{color:#126e73}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.map-wrap{position:relative;height:51vh;min-height:310px;background:#e6ecec}.map-wrap iframe{display:block;width:100%;height:100%;border:0}.map-wrap:fullscreen{height:100vh;width:100vw;background:white}.map-wrap:fullscreen iframe{height:100%}.fullscreen{position:absolute;right:14px;top:14px;z-index:10;border:1px solid #bdcbd1;border-radius:8px;background:white;color:#18232b;padding:10px 14px;font-weight:650;cursor:pointer;box-shadow:0 2px 8px #0002}main{max-width:1400px;margin:auto;padding:20px 18px 60px}h2{margin:10px 0 16px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.label{font-size:.85rem;color:var(--muted)}.value{font-size:1.25rem;font-weight:700;margin-top:6px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-top:26px}.scroll{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:570px}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}th{background:#f9fbfb}input{border:1px solid #bbcbd0;border-radius:8px;padding:10px 12px;max-width:100%;width:290px}.muted{color:var(--muted)}@media(max-width:650px){.map-wrap{height:43vh;min-height:270px}header{padding:10px 14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.value{font-size:1.05rem}.card{padding:12px}main{padding:14px}}</style></head><body><header><strong>Train Tracker <span class="muted">· TEST</span></strong><nav><a href="map.html">Map only</a><a href="snapshot.html">Snapshot</a><a href="legacy-dashboard.html">Old dashboard</a></nav></header><section id="map" class="map-wrap" aria-label="Amtrak system map"><iframe title="Existing Leaflet train map" src="https://script.google.com/macros/s/AKfycbwfyE52sV4h09hp6z8V8tYdJ9msZfAgETcrHPTkcm9XEoDNflmdhw50T6C7_cREy6VfdA/exec" loading="eager"></iframe><button id="fullscreen" class="fullscreen" type="button" aria-label="Toggle fullscreen map">⛶ Fullscreen map</button></section><main><h2>Amtrak system completion</h2><div id="metrics" class="metrics"></div><div class="section-head"><h2>Trip history</h2><input id="search" type="search" placeholder="Search trips…" aria-label="Search trip history"></div><p id="count" class="muted"></p><div class="scroll"><table><thead><tr><th>Date</th><th>Service</th><th>From</th><th>To</th><th>Accommodation</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">Read-only snapshot from the master spreadsheet. <a href="https://script.google.com/macros/s/AKfycbwfyE52sV4h09hp6z8V8tYdJ9msZfAgETcrHPTkcm9XEoDNflmdhw50T6C7_cREy6VfdA/exec" target="_blank" rel="noopener noreferrer">Open original map</a>.</p></main><script src="snapshot-data.js"></script><script>const data=window.TRAIN_SNAPSHOT;const metrics=document.getElementById('metrics');for(const [label,value] of Object.entries(data.metrics)){const c=document.createElement('div');c.className='card';const l=document.createElement('div');l.className='label';l.textContent=label;const v=document.createElement('div');v.className='value';v.textContent=value;c.append(l,v);metrics.append(c)}const input=document.getElementById('search'),rows=document.getElementById('rows'),count=document.getElementById('count');function render(){const q=input.value.toLowerCase();const matches=data.trips.filter(t=>Object.values(t).join(' ').toLowerCase().includes(q));rows.replaceChildren();for(const t of matches){const tr=document.createElement('tr');for(const key of ['date','service','from','to','accommodation']){const td=document.createElement('td');td.textContent=t[key]||'';tr.append(td)}rows.append(tr)}count.textContent=matches.length+' trips shown'}input.addEventListener('input',render);render();const map=document.getElementById('map'),btn=document.getElementById('fullscreen');btn.addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen()}else if(map.requestFullscreen){map.requestFullscreen()}});document.addEventListener('fullscreenchange',()=>{btn.textContent=document.fullscreenElement?'✕ Exit fullscreen':'⛶ Fullscreen map'});</script></body></html>
