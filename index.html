<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bonch.fyi — Coming Soon</title>
  <style>
    html, body {margin:0;min-height:100%;background:white}
    body {min-height:100vh;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;color:#333}
    main {width:min(92vw,650px);text-align:center}
    img {display:block;width:100%;height:auto}
    p {margin:0 0 2rem;font-size:clamp(1rem,3.4vw,1.4rem);letter-spacing:.025em}
  </style>
</head>
<body>
  <main>
    <img id="train" src="train-6.png" alt="Minimalist grayscale train illustration">
    <p>Coming to a station near you soon.</p>
  </main>
  <script>
    const number = Math.floor(Math.random() * 6) + 1;
    document.getElementById('train').src = `train-${number}.png`;
  </script>
</body>
</html>
